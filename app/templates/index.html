<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { font-size: 0.85rem; }
    h2 { font-size: 1.5rem; }
    .card-body { padding: 0.75rem 1rem; }
    .form-label { font-size: 0.8rem; margin-bottom: 0.2rem; }
    .container .card { margin-bottom: 0.75rem !important; }
  </style>
</head>
<body class="bg-light">
<div class="container py-3 mx-auto" style="max-width: 760px;">
  <h2 class="mb-1 text-center">Loan EMI Calculator</h2>
  <p class="text-muted text-center">Calculate the Equated Monthly Instalment. Every calculation is stored in MongoDB.</p>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="emiForm" novalidate>
        <div class="row g-3">
          <div class="col-4">
            <label for="principal" class="form-label">Loan amount (P)</label>
            <input type="number" class="form-control" id="principal" min="1" step="any" placeholder="e.g. 500000">
          </div>
          <div class="col-4">
            <label for="rate" class="form-label">Annual interest rate (%)</label>
            <input type="number" class="form-control" id="rate" min="0.01" step="any" placeholder="e.g. 12">
          </div>
          <div class="col-4">
            <label for="months" class="form-label">Tenure (months)</label>
            <input type="number" class="form-control" id="months" min="1" step="1" placeholder="e.g. 24">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 d-block mx-auto">Calculate EMI</button>
      </form>
      <div id="error" class="alert alert-danger mt-3 mb-0 d-none"></div>
    </div>
  </div>

  <div id="result" class="card shadow-sm mb-4 d-none">
    <div class="card-body">
      <h5 class="card-title text-center">Result</h5>
      <div class="row text-center">
        <div class="col-4"><div class="text-muted small">Monthly EMI</div><div class="fs-4 fw-bold" id="rEmi"></div></div>
        <div class="col-4"><div class="text-muted small">Total payment</div><div class="fs-4 fw-bold" id="rTotal"></div></div>
        <div class="col-4"><div class="text-muted small">Total interest</div><div class="fs-4 fw-bold" id="rInterest"></div></div>
      </div>
      <hr>
      <div class="small text-muted text-center">Served by pod: <b id="rPod"></b> &nbsp;|&nbsp; Pod IP: <b id="rIp"></b></div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title text-center">Last 10 calculations</h5>
      <div class="table-responsive">
        <table class="table table-sm table-striped align-middle mb-0 text-center" id="history">
          <thead>
            <tr><th>Time</th><th>Amount</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served by</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted small mt-4">Loan EMI Calculator &middot; version 1.0</footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  function fmt(n) {
    return Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
  function showError(msg) {
    $("#error").text(msg).removeClass("d-none");
  }
  function loadHistory() {
    $.getJSON("/api/history").done(function (rows) {
      var $body = $("#history tbody").empty();
      if (!rows.length) {
        $body.append($("<tr>").append($("<td colspan='6' class='text-muted'>").text("No calculations yet.")));
        return;
      }
      $.each(rows, function (_, r) {
        $body.append($("<tr>").append(
          $("<td>").text(new Date(r.createdAt).toLocaleString()),
          $("<td>").text(fmt(r.principal)),
          $("<td>").text(r.rate),
          $("<td>").text(r.months),
          $("<td>").text(fmt(r.emi)),
          $("<td>").text(r.servedBy)
        ));
      });
    });
  }
  $("#emiForm").on("submit", function (e) {
    e.preventDefault();
    $("#error").addClass("d-none");
    var p = parseFloat($("#principal").val());
    var rate = parseFloat($("#rate").val());
    var n = parseFloat($("#months").val());
    if (!(p > 0) || !(rate > 0) || !(n > 0)) {
      showError("Please enter positive numbers for the amount, the rate and the tenure.");
      return;
    }
    if (n !== Math.floor(n)) {
      showError("The tenure must be a whole number of months.");
      return;
    }
    $.ajax({
      url: "/api/emi", method: "POST", contentType: "application/json", dataType: "json",
      data: JSON.stringify({principal: p, rate: rate, months: n})
    }).done(function (d) {
      $("#rEmi").text(fmt(d.emi));
      $("#rTotal").text(fmt(d.totalPayment));
      $("#rInterest").text(fmt(d.totalInterest));
      $("#rPod").text(d.servedBy);
      $("#rIp").text(d.ip);
      $("#result").removeClass("d-none");
      loadHistory();
    }).fail(function (xhr) {
      showError(xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "The request failed.");
    });
  });
  loadHistory();
</script>
</body>
</html>
